<section class="page-hero" aria-labelledby="page-title">
        <div class="wrap">
          <span class="eyebrow">$eyebrow</span>
          <h1 id="page-title">$h1</h1>
          <p class="lead">$lead</p>
        </div>
      </section>

      <section class="section-tight" aria-labelledby="desc-title">
        <div class="wrap">
          $desc_head
          <div class="grid grid-3">$descriptions</div>
        </div>
      </section>

      <section class="section" aria-labelledby="assets-title">
        <div class="wrap">
          $assets_head
          <ul class="press-assets">$assets</ul>
        </div>
      </section>

      <section class="section" aria-labelledby="facts-title">
        <div class="wrap feature-row">
          <div>
            <span class="eyebrow">$facts_eyebrow</span>
            <h2 id="facts-title">$facts_title</h2>
            <p class="lead">$facts_lead</p>
          </div>
          $facts
        </div>
      </section>
