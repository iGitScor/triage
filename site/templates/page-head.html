<!doctype html>
<html lang="$lang">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title</title>
    <meta name="description" content="$description" />
    <link rel="canonical" href="$url" />
    <link rel="alternate" hreflang="$lang" href="$url" />
    <link rel="alternate" hreflang="$other" href="$other_url" />
    <link rel="alternate" type="application/atom+xml" title="Remora releases" href="$releases_feed" />
    <link rel="alternate" hreflang="x-default" href="$origin/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="$backdrop_light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="$backdrop_dark" />
    <link rel="icon" type="image/svg+xml" href="/site/favicon.svg" />
    <link rel="apple-touch-icon" href="/site/apple-touch-icon.png" />
    <link rel="preload" href="/site/outfit.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/site/tokens.css" />
    <link rel="stylesheet" href="/site/site.css" />
    <link rel="stylesheet" href="/site/remora.css" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Remora" />
    <meta property="og:locale" content="$locale" />
    <meta property="og:locale:alternate" content="$other_locale" />
    <meta property="og:url" content="$url" />
    <meta property="og:title" content="$title" />
    <meta property="og:description" content="$description" />
    <meta property="og:image" content="$origin/site/og.$lang.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="$og_alt" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="$title" />
    <meta name="twitter:description" content="$description" />
    <meta name="twitter:image" content="$origin/site/og.$lang.png" />
    <script src="/site/site.js" defer></script>
$structured  </head>
  <body>
    <a class="skip-link" href="#main">$skip</a>
    <header class="site-header">
      <div class="wrap header-bar">
        $brand
        <nav class="site-nav" aria-label="$nav_label"><ul>$nav</ul></nav>
        <div class="header-actions">
          <nav class="lang-switch" aria-label="$lang_label">$switch</nav>
          <a class="btn btn-primary btn-sm" href="$dmg" data-download="mac">$get_short</a>
        </div>
      </div>
    </header>
    <main id="main">
