      <section class="page-hero" aria-labelledby="page-title">
        <div class="wrap">
          <span class="eyebrow">$eyebrow</span>
          <h1 id="page-title">$h1</h1>
          <p class="lead">$lead</p>
        </div>
      </section>

      <section class="section-tight" aria-labelledby="out-title">
        <div class="wrap">
          $out_head
          $out_table
        </div>
      </section>

      <section class="section" aria-labelledby="stay-title">
        <div class="wrap feature-row">
          <div><span class="eyebrow">$stay_eyebrow</span><h2 id="stay-title">$stay_title</h2></div>
          $stay_table
        </div>
      </section>

      <section class="band" aria-labelledby="enforce-title">
        <div class="wrap">
          <div class="section-head"><span class="eyebrow">$enforce_eyebrow</span><h2 id="enforce-title">$enforce_title</h2></div>
          <div class="grid grid-3">$enforce</div>
        </div>
      </section>

      <section class="section" aria-labelledby="mdm-title">
        <div class="wrap feature-row">
          <div>
            <span class="eyebrow">$mdm_eyebrow</span>
            <h2 id="mdm-title">$mdm_title</h2>
            <p class="lead">$mdm_lead</p>
          </div>
          <figure class="code-card">
            <figcaption><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>$mdm_caption</span></figcaption>
            <pre><code>$mdm_sample</code></pre>
          </figure>
        </div>
        <div class="wrap">
          $mdm_table
          <p class="notice">$info<span>$windows</span></p>
          <p class="cta-note"><a class="link-arrow" href="$more_href">$more</a></p>
        </div>
      </section>
