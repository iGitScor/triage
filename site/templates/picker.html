$head
    <link rel="canonical" href="$origin/" />
    <link rel="alternate" hreflang="fr" href="$origin/fr/" />
    <link rel="alternate" hreflang="en" href="$origin/en/" />
    <link rel="alternate" hreflang="x-default" href="$origin/" />
    <script src="/site/site.js"></script>
  </head>
  <body>
    <main id="main" class="center-page">
      <div class="stack">
        $brand
        <h1>$tagline_en</h1>
        <p class="lead" lang="fr">$tagline_fr</p>
        <div class="ctas">
          <a class="btn btn-primary btn-lg" href="/en/" hreflang="en" data-lang="en">$name_en</a>
          <a class="btn btn-primary btn-lg" href="/fr/" hreflang="fr" lang="fr" data-lang="fr">$name_fr</a>
        </div>
      </div>
    </main>
  </body>
</html>
