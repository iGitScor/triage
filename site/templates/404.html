$head
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <main id="main" class="center-page">
      <div class="stack">
        $brand
        <p class="big-code" aria-hidden="true">4<span class="mark">0</span>4</p>
        <h1><span lang="fr">$title_fr</span> · <span lang="en">$title_en</span></h1>
        <div class="bilingual">
          <section class="card card-field" lang="fr" aria-labelledby="nf-fr">
            <h2 id="nf-fr">$heading_fr</h2>
            <p>$text_fr</p>
            <div class="ctas"><a class="btn btn-primary btn-sm" href="/fr/" data-lang="fr">$home_fr</a></div>
          </section>
          <section class="card card-field" lang="en" aria-labelledby="nf-en">
            <h2 id="nf-en">$heading_en</h2>
            <p>$text_en</p>
            <div class="ctas"><a class="btn btn-primary btn-sm" href="/en/" data-lang="en">$home_en</a></div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
