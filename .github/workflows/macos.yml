name: macOS

on:
  workflow_dispatch:
  push:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26.6 (Swift 6.2), not whatever the image defaults to
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Formatting (.swift-format)
        run: swift format lint --strict --parallel -r Sources Tests Package.swift
      - name: Every UI string has French, and Localizable.strings is up to date
        run: python3 scripts/make-strings.py --check
      - name: Test
        run: swift test
      - name: Build the app (signed ad hoc on CI)
        run: ./scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/Remora.app build/Remora-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remora-macos
          path: macos/build/Remora-macos.zip
