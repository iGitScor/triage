name: macOS

on:
  workflow_dispatch:
  push:
    paths: ["macos/**", "eval/**", "mcp/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "eval/**", "mcp/**", ".github/workflows/macos.yml"]

# A newer push to the same branch or pull request cancels the run in progress.
# Reading the repository is all these jobs need: a dependency or action gone bad gets no token that can push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26.6 (Swift 6.2), not whatever the image defaults to
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Formatting (.swift-format)
        run: swift format lint --strict --parallel -r Sources Tests Package.swift
      - name: Every UI string has French, and Localizable.strings is up to date
        run: python3 scripts/make-strings.py --check
      # Any compiler warning fails, in the tests and in the app, as clippy's -D warnings does on Windows.
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      # Pull requests build the debug app, from the tests' build: the app target is checked without an optimized
      # compile. Pushes build the release app and keep it as an artifact.
      - name: Build the app (signed ad hoc on CI)
        run: ./scripts/build-app.sh
        env:
          REMORA_STRICT: "1"
          CONFIG: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
      - name: Package
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent build/Remora.app build/Remora-macos.zip
      # The DMG as the release makes it (window, background, licences), so a broken layout shows before a tag.
      - name: The DMG builds
        if: github.event_name != 'pull_request'
        run: make dmg && ls -l build/Remora.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: Remora-macos
          path: macos/build/Remora-macos.zip
