name: Dependencies

# Known vulnerabilities and licences. Also weekly: a new advisory can appear without any change here.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "desktop/Cargo.lock"
      - "desktop/deny.toml"
      - "package-lock.json"
      - "desktop/app/package-lock.json"
      - "docs/package-lock.json"
      - "site/package-lock.json"
      - ".github/workflows/dependencies.yml"
  pull_request:
    paths:
      - "desktop/Cargo.lock"
      - "desktop/deny.toml"
      - "package-lock.json"
      - "desktop/app/package-lock.json"
      - "docs/package-lock.json"
      - "site/package-lock.json"
      - ".github/workflows/dependencies.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Advisories, licences, sources (desktop/deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: desktop/Cargo.toml
          command: check advisories licenses sources bans

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # What ships in the Windows app: any high or critical advisory fails.
      - name: Windows interface
        run: npm audit --omit=dev --audit-level=high
        working-directory: desktop/app
      # The docs: VitePress 1 runs on a patched Vite and KaTeX through `overrides` in docs/package.json, until
      # VitePress 2 and its Mermaid plugin are stable. A high or critical advisory fails.
      - name: Documentation
        run: npm audit --audit-level=high
        working-directory: docs
      # The website's deploy tool (wrangler): the release workflow runs it with the Cloudflare token, so a high or
      # critical advisory fails.
      - name: Website deploy tool
        run: npm audit --audit-level=high
        working-directory: site
      # Repository tooling (Biome, lefthook): never shipped.
      - name: Tooling
        run: npm audit --audit-level=critical
