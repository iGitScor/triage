name: Release

# Set the version first (`make version V=0.3.2`), commit, then push the tag v0.3.2. The apps (macOS, Windows, and
# Linux in preview) are checked and built in parallel; the release is published only when all succeed, with every
# file at once, so a failure never leaves a half-published release. Each build job also writes its app's SBOM (CycloneDX, from the lockfiles) and signs two
# attestations for the file it built: where it was built from (provenance) and what is in it (the SBOM).
# Anyone can check them: `gh attestation verify Remora.dmg --repo iGitScor/triage`. The files keep the same name in every release, so the website links to
# https://github.com/iGitScor/triage/releases/latest/download/Remora.dmg (and Remora-Setup.exe, Remora-x86_64.AppImage,
# Remora-amd64.deb).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag matches the version in the source
        run: python3 scripts/version.py --check "${GITHUB_REF_NAME#v}"

  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.identity != '' }}
    permissions:
      contents: read
      id-token: write # signs the attestations (Sigstore, through GitHub's OIDC token)
      attestations: write
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Xcode 26.6 (Swift 6.2), not whatever the image defaults to
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # From the source before anything is built: Swift packages (none today) and the files the app bundles.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: macos
          format: cyclonedx-json
          output-file: macos/Remora.dmg.cdx.json
          upload-artifact: false
      - name: Every UI string has French
        run: python3 scripts/make-strings.py --check
      - name: Test
        run: swift test
      - name: Stamp the build number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
      # The same self-signed certificate for every release (from `scripts/make-signing-cert.sh --release`): the
      # Keychain recognizes Remora by it, so users allow access once, not after each update. Without the secrets
      # (forks), the app is signed ad hoc as before. Gatekeeper still asks until the app is notarized.
      - name: Import the release signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No MACOS_SIGNING_P12 secret: the app is signed ad hoc, and the Keychain will ask again after this update."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "identity=Remora Release Signing" >> "$GITHUB_OUTPUT"
      - name: Build the app (Universal)
        env:
          REMORA_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          REMORA_UNIVERSAL=1 ./scripts/build-app.sh
          codesign --verify --strict --verbose=2 build/Remora.app
          # What the Keychain recognizes: with the release certificate, the same in every release.
          codesign -d -r- build/Remora.app
      - name: Package the DMG
        run: |
          mkdir -p build/dmg
          cp -R build/Remora.app build/dmg/
          ln -s /Applications build/dmg/Applications
          cp ../LICENSE build/dmg/LICENSE.txt
          cp Resources/LICENCES.txt build/dmg/Third-party\ licences.txt
          cp Resources/Outfit-OFL.txt build/dmg/
          hdiutil create -volname Remora -srcfolder build/dmg -ov -format UDZO build/Remora.dmg
          shasum -a 256 build/Remora.dmg | sed 's| build/| |' > build/Remora.dmg.sha256
          # Next to the DMG, so the artifact keeps every file at the same level.
          mv Remora.dmg.cdx.json build/
          cat build/Remora.dmg.sha256
      # The Ed25519 signature the app checks before installing an update (scripts/updates/make-key.swift).
      # Only for an app signed with the release certificate: an update must match the installed app's signature.
      - name: Sign the update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          SIGNED: ${{ steps.signing.outputs.identity != '' }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ] || [ "$SIGNED" != true ]; then
            echo "::warning::No UPDATE_SIGNING_KEY secret or release certificate: Macs won't be offered this update."
            exit 0
          fi
          swift scripts/updates/sign.swift build/Remora.dmg > build/Remora.dmg.update-sig
      - name: Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: macos/build/Remora.dmg
      - name: SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: macos/build/Remora.dmg
          sbom-path: macos/build/Remora.dmg.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            macos/build/Remora.dmg
            macos/build/Remora.dmg.sha256
            macos/build/Remora.dmg.cdx.json
            macos/build/Remora.dmg.update-sig
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    # Signing waits for a maintainer to approve each request in SignPath.
    timeout-minutes: 150
    outputs:
      signed: ${{ steps.signing.outputs.enabled == 'true' }}
    permissions:
      contents: read
      id-token: write # signs the attestations (Sigstore, through GitHub's OIDC token)
      attestations: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # From the lockfiles before anything is installed or built: the Rust crates (Cargo.lock) and the interface's
      # npm packages (app/package-lock.json).
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: desktop
          format: cyclonedx-json
          output-file: desktop/Remora-Setup.exe.cdx.json
          upload-artifact: false
      - name: Rust from desktop/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - run: npm ci
        working-directory: desktop/app
      # The same checks as windows.yml: a release never skips what CI runs.
      - name: French strings are up to date
        run: python scripts/make-i18n.py --check
        working-directory: desktop/app
      - name: Type-check, test and build the interface
        run: npm run check && npm test && npm run build
        working-directory: desktop/app
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The licences of what the app bundles (DEP-07), with cargo-about pinned by checksum.
      - name: Third-party notices
        shell: bash
        env:
          ABOUT: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-pc-windows-msvc.tar.gz
          ABOUT_SHA256: 1c03e5890238562497c2d89a3b75b02560af349c1fc3e713d3284f532a5cd748
        run: |
          curl -fsSL -o "$RUNNER_TEMP/about.tgz" "$ABOUT"
          echo "$ABOUT_SHA256  $RUNNER_TEMP/about.tgz" | sha256sum -c -
          # From inside the folder: Git Bash's tar takes "D:\…" for a remote host.
          (cd "$RUNNER_TEMP" && tar -xzf about.tgz)
          CARGO_ABOUT="$RUNNER_TEMP/cargo-about-0.9.2-x86_64-pc-windows-msvc/cargo-about.exe" python ../scripts/make-notices.py
      - name: Build the app and the installer
        run: npx tauri build
        working-directory: desktop/app
      # Signed by SignPath with the SignPath Foundation certificate for open-source projects (see
      # docs/admin/code-signing.md). The app first, then the installer rebuilt around the signed app: the build
      # above already wrote the bundle type into the app, so the second bundling must not patch it again. Each
      # request waits for a maintainer's approval in SignPath. Without the secret (forks), both stay unsigned.
      # SignPath's artifact configuration "exe": <zip-file><pe-file path="*.exe"><authenticode-sign/></pe-file></zip-file>
      - name: Is signing set up
        id: signing
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SIGNPATH_API_TOKEN secret: the installer is not signed."
          fi
      - name: Upload the app for signing
        id: unsigned-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: desktop/target/release/remora.exe
          if-no-files-found: error
      - name: Sign the app
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: remora
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/target/release
      - name: Rebuild the installer around the signed app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          rm -rf ../target/release/bundle/nsis
          npx tauri bundle --bundles nsis --no-binary-patching
        working-directory: desktop/app
      - name: Upload the installer for signing
        id: unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: remora
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/signed
      - name: Name it for the release
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          if [ "$SIGNED" = true ]; then
            cp signed/*-setup.exe Remora-Setup.exe
            # Both must carry a valid signature: the installer, and the app it installs.
            for FILE in Remora-Setup.exe target/release/remora.exe; do
              STATUS="$(pwsh -NoProfile -Command "(Get-AuthenticodeSignature '$FILE').Status")"
              echo "$FILE: $STATUS"
              [ "$STATUS" = Valid ] || exit 1
            done
          else
            cp target/release/bundle/nsis/*-setup.exe Remora-Setup.exe
          fi
          sha256sum Remora-Setup.exe > Remora-Setup.exe.sha256
          cat Remora-Setup.exe.sha256
      - name: Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: desktop/Remora-Setup.exe
      - name: SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: desktop/Remora-Setup.exe
          sbom-path: desktop/Remora-Setup.exe.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            desktop/Remora-Setup.exe
            desktop/Remora-Setup.exe.sha256
            desktop/Remora-Setup.exe.cdx.json
          if-no-files-found: error

  # Linux (preview, LINUX-01): an AppImage, which updates itself, and a .deb, updated by installing the new one. Built
  # on the oldest supported Ubuntu, so the glibc it needs is old enough for most distributions.
  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # signs the attestations (Sigstore, through GitHub's OIDC token)
      attestations: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: desktop
          format: cyclonedx-json
          output-file: desktop/Remora-x86_64.AppImage.cdx.json
          upload-artifact: false
      - name: Rust from desktop/rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop/app
      # The same checks as CI: a release never skips what CI runs.
      - name: Lint and test
        run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
      # The licences of what the app bundles (DEP-07), with cargo-about pinned by checksum.
      - name: Third-party notices
        env:
          ABOUT: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
        run: |
          curl -fsSL -o "$RUNNER_TEMP/about.tgz" "$ABOUT"
          echo "$ABOUT_SHA256  $RUNNER_TEMP/about.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/about.tgz" -C "$RUNNER_TEMP"
          CARGO_ABOUT="$RUNNER_TEMP/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" python3 ../scripts/make-notices.py
      - name: Build the AppImage and the .deb
        run: npx tauri build --bundles appimage,deb
        working-directory: desktop/app
      - name: Name them for the release
        run: |
          cp target/release/bundle/appimage/*.AppImage Remora-x86_64.AppImage
          cp target/release/bundle/deb/*.deb Remora-amd64.deb
          cp Remora-x86_64.AppImage.cdx.json Remora-amd64.deb.cdx.json
          sha256sum Remora-x86_64.AppImage > Remora-x86_64.AppImage.sha256
          sha256sum Remora-amd64.deb > Remora-amd64.deb.sha256
          cat ./*.sha256
      - name: Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            desktop/Remora-x86_64.AppImage
            desktop/Remora-amd64.deb
      - name: SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: |
            desktop/Remora-x86_64.AppImage
            desktop/Remora-amd64.deb
          sbom-path: desktop/Remora-x86_64.AppImage.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            desktop/Remora-x86_64.AppImage
            desktop/Remora-x86_64.AppImage.sha256
            desktop/Remora-x86_64.AppImage.cdx.json
            desktop/Remora-amd64.deb
            desktop/Remora-amd64.deb.sha256
            desktop/Remora-amd64.deb.cdx.json
          if-no-files-found: error

  # The updater's signature, over the final (Authenticode-signed) installer and bound to this version, so an old
  # installer can't be passed off as a new one (`requireSignedVersion`). Key: `npx tauri signer generate`. In its own
  # job, so the key never meets the build's npm packages, their install scripts or the restored caches: it gets only
  # the installer and Tauri's standalone CLI, pinned by checksum. It needn't follow app/package.json: the signature
  # format is the same across Tauri 2.
  windows-update:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAURI_CLI: https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.1/cargo-tauri-x86_64-unknown-linux-gnu.tgz
      TAURI_CLI_SHA256: 04ef3a9a2ed7b7dc479bef08ab40deee80065c99fc778f79ebce775eb72bbeff
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows
          path: dist
      # The AppImage replaces itself with the same key; a .deb is updated by installing the new package.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux
          path: dist
      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: Windows and Linux won't be offered this update."
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/tauri.tgz" "$TAURI_CLI"
          echo "$TAURI_CLI_SHA256  $RUNNER_TEMP/tauri.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tauri.tgz" -C "$RUNNER_TEMP" cargo-tauri
          for FILE in dist/Remora-Setup.exe dist/Remora-x86_64.AppImage; do
            "$RUNNER_TEMP/cargo-tauri" signer sign --app-version "${GITHUB_REF_NAME#v}" "$FILE"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-update
          path: |
            dist/Remora-Setup.exe.sig
            dist/Remora-x86_64.AppImage.sig
          if-no-files-found: ignore

  publish:
    needs: [macos, windows, linux, windows-update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: policy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # Ready-to-import policy files for IT (EASE-12): profile, .reg, ADMX/ADML, Jamf schema, Linux policy.json.
      - name: The policy files, in one zip
        run: cd policy && zip -r ../dist/Remora-policy-files.zip . -x README.md
      - name: Publish the release with every file
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ needs.macos.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          ls -l dist
          # The notes say what this release really is: signed or not depends on the secrets set.
          if [ "$MAC_SIGNED" = true ]; then
            KEYCHAIN="macOS may ask for Keychain access once more after this update; choose Always Allow and it won't ask again."
          else
            KEYCHAIN="macOS asks for Keychain access once after each update; choose Always Allow."
          fi
          if [ "$WINDOWS_SIGNED" = true ]; then
            SMARTSCREEN="The installer is signed (publisher: SignPath Foundation, see the [code signing policy](https://triage.iscor.me/docs/admin/code-signing)). For a brand-new release, SmartScreen may still warn until it knows the file: More info → Run anyway."
          else
            SMARTSCREEN="The installer isn't signed yet: if Windows says it protected your PC, click More info → Run anyway."
          fi
          cat > notes.md <<EOF
          **Mac: [Remora.dmg](https://github.com/iGitScor/triage/releases/latest/download/Remora.dmg)** (macOS 14 or later), open it and drag Remora to Applications. Remora isn't notarized yet: the first time, right-click Remora → Open (on macOS 15: System Settings → Privacy & Security → Open Anyway). $KEYCHAIN

          **Windows (preview): [Remora-Setup.exe](https://github.com/iGitScor/triage/releases/latest/download/Remora-Setup.exe)** (Windows 10 or 11), installs for your user only. $SMARTSCREEN

          **Linux (preview, community supported): [Remora-x86_64.AppImage](https://github.com/iGitScor/triage/releases/latest/download/Remora-x86_64.AppImage)**, which updates itself, or **[Remora-amd64.deb](https://github.com/iGitScor/triage/releases/latest/download/Remora-amd64.deb)** for Ubuntu and Debian (update by installing the new one). Needs WebKitGTK 4.1, a keyring (GNOME Keyring, KWallet or KeePassXC) and a tray (on GNOME, the AppIndicator extension; without one Remora opens as a window).

          **Check a download**: each file has its SHA-256 and its SBOM (\`.cdx.json\`, CycloneDX) next to it, and a signed record of the workflow run and commit it was built from: \`gh attestation verify Remora.dmg --repo iGitScor/triage\`.
          EOF
          # latest.json, what the apps read when updates are on (Tauri's format; the Mac has its own key).
          # Only platforms whose file was signed for updating are listed.
          python3 - <<'PY'
          import datetime, json, os, pathlib
          tag, repo = os.environ["GITHUB_REF_NAME"], os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          files = {"macos-universal": ("Remora.dmg", "Remora.dmg.update-sig"), "windows-x86_64": ("Remora-Setup.exe", "Remora-Setup.exe.sig"),
                   "linux-x86_64": ("Remora-x86_64.AppImage", "Remora-x86_64.AppImage.sig")}
          platforms = {key: {"url": f"{base}/{name}", "signature": pathlib.Path("dist", sig).read_text().strip()}
                       for key, (name, sig) in files.items() if pathlib.Path("dist", sig).exists()}
          if platforms:
              pathlib.Path("dist/latest.json").write_text(json.dumps({
                  "version": tag.removeprefix("v"),
                  "notes": f"https://github.com/{repo}/releases/tag/{tag}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }, indent=2))
          print("latest.json:", ", ".join(platforms) or "none (no update signature)")
          PY
          EXTRA=()
          [ -f dist/latest.json ] && EXTRA=(dist/latest.json)
          gh release create "$GITHUB_REF_NAME" dist/Remora.dmg dist/Remora.dmg.sha256 dist/Remora.dmg.cdx.json \
            dist/Remora-Setup.exe dist/Remora-Setup.exe.sha256 dist/Remora-Setup.exe.cdx.json \
            dist/Remora-x86_64.AppImage dist/Remora-x86_64.AppImage.sha256 dist/Remora-x86_64.AppImage.cdx.json \
            dist/Remora-amd64.deb dist/Remora-amd64.deb.sha256 dist/Remora-amd64.deb.cdx.json \
            dist/Remora-policy-files.zip "${EXTRA[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "Remora ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes --verify-tag
