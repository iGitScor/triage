name: Windows

on:
  workflow_dispatch:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Test the core and plugins
        run: cargo test --workspace
      # Installer (MSI/NSIS) build is added with the Tauri app: pnpm install, pnpm tauri build, upload artifact.
