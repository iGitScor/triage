name: Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/windows.yml"

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json
      - name: Install the interface's packages
        run: npm ci
        working-directory: windows/app
      - name: Every string the app shows has French, and fr.json is up to date
        run: python scripts/make-i18n.py --check
        working-directory: windows/app
      - name: Emoji tables match scripts/make-emoji.py
        run: python ../scripts/make-emoji.py --check
      - name: Type-check, test and build the interface
        run: npm run check && npm test && npm run build
        working-directory: windows/app
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the installer
        run: npx tauri build
        working-directory: windows/app
      - uses: actions/upload-artifact@v4
        with:
          name: Remora-windows
          path: windows/target/release/bundle/nsis/*.exe
