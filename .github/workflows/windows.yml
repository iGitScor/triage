name: Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/windows.yml"

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust from windows/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json
      - name: Install the interface's packages
        run: npm ci
        working-directory: windows/app
      - name: Every string the app shows has French, and fr.json is up to date
        run: python scripts/make-i18n.py --check
        working-directory: windows/app
      - name: Emoji tables match scripts/make-emoji.py
        run: python ../scripts/make-emoji.py --check
      - name: Type-check, test and build the interface
        run: npm run check && npm test && npm run build
        working-directory: windows/app
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the installer
        run: npx tauri build
        working-directory: windows/app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remora-windows
          path: windows/target/release/bundle/nsis/*.exe
