name: Website

# Accessibility of the marketing pages and the docs: every page, light and dark, against WCAG 2.1 AA with axe
# (scripts/a11y.mjs), and every internal link (scripts/check-links.py). Locally: `make a11y` and `make links`.
on:
  workflow_dispatch:
  push:
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/a11y.mjs"
      - "scripts/check-links.py"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/a11y.mjs"
      - "scripts/check-links.py"
      - "package-lock.json"
      - ".github/workflows/site.yml"

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - name: Install Playwright, axe and the docs' packages
        run: |
          npm ci --ignore-scripts
          npm --prefix docs ci
          npx playwright install --with-deps chromium
      - name: Build the docs into site/public/docs
        run: npm --prefix docs run build
      - name: The docs' CSP in site/public/_headers covers their inline scripts
        run: python3 site/csp.py --check
      - name: Every internal link leads to a page, the language menu included
        run: python3 scripts/check-links.py
      - name: Check every page
        run: node scripts/a11y.mjs
