name: Website

# Accessibility of the marketing pages and the docs: every page, light and dark, against WCAG 2.1 AA with axe
# (scripts/a11y.mjs), and every internal link (scripts/check-links.py). Locally: `make a11y` and `make links`.
# On main, a website-only change is then deployed (see the deploy job).
on:
  workflow_dispatch:
  push:
    paths:
      - "site/**"
      - "docs/**"
      - "macos/Resources/Info.plist" # the version the pages show
      - "scripts/a11y.mjs"
      - "scripts/check-links.py"
      - "policy/policy.json" # the privacy page's MDM sample
      - "scripts/make-policy-files.py" # the privacy page's MDM table
      - "package-lock.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "macos/Resources/Info.plist" # the version the pages show
      - "scripts/a11y.mjs"
      - "scripts/check-links.py"
      - "policy/policy.json" # the privacy page's MDM sample
      - "scripts/make-policy-files.py" # the privacy page's MDM table
      - "package-lock.json"
      - ".github/workflows/site.yml"

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sitemap's date is when the site's copy, templates or build last changed
      - name: The committed pages are what site/build.py writes
        run: |
          python3 site/build.py
          git diff --exit-code -- site/public
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - name: Install Playwright, axe and the docs' packages
        run: |
          npm ci --ignore-scripts
          npm --prefix docs ci
          npx playwright install --with-deps chromium
      - name: Build the docs into site/public/docs
        run: npm --prefix docs run build
      - name: The docs' CSP in site/public/_headers covers their inline scripts
        run: python3 site/csp.py --check
      - name: Every internal link leads to a page, the language menu included
        run: python3 scripts/check-links.py
      - name: Check every page
        run: node scripts/a11y.mjs

  # Between releases, a website-only change goes out on its own. The docs on main often describe what the next
  # release brings, so it deploys only when every commit since the last release that touches site/ or docs/ touches
  # nothing else, and never on a version change: the release workflow deploys those.
  deploy:
    needs: accessibility
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and the commits since the last release
      - name: Only website changes since the last release
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          hold() { echo "::warning::$1 The website waits for the next release (or make deploy)."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "$TOKEN" ] || hold "No CLOUDFLARE_API_TOKEN secret."
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git diff --quiet "$tag" HEAD -- macos/Resources/Info.plist || hold "The version changed since $tag."
          [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ] || hold "This is the $tag release commit."
          for commit in $(git rev-list "$tag..HEAD" -- site docs); do
            others=$(git diff-tree --no-commit-id --name-only -r "$commit" | grep -Ev '^(site|docs)/' | head -3 | tr '\n' ' ')
            [ -z "$others" ] || hold "$(git log -1 --format='%h %s' "$commit") also changes ${others}since $tag."
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            site/package-lock.json
      - name: Build the docs and their CSP, then deploy
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm --prefix docs ci
          npm --prefix docs run build
          python3 site/csp.py
          npm --prefix site ci --ignore-scripts
          cd site && npx --no-install wrangler deploy
