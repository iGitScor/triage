name: Windows and Linux

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/desktop.yml"

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust from desktop/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Install the interface's packages
        run: npm ci
        working-directory: desktop/app
      - name: Every string the app shows has French, and fr.json is up to date
        run: python scripts/make-i18n.py --check
        working-directory: desktop/app
      - name: Emoji tables match scripts/make-emoji.py
        run: python ../scripts/make-emoji.py --check
      - name: Type-check, test and build the interface
        run: npm run check && npm test && npm run build
        working-directory: desktop/app
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the installer
        run: npx tauri build
        working-directory: desktop/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Remora-windows
          path: desktop/target/release/bundle/nsis/*.exe

  # The same Rust on Linux (LINUX-04): the `cfg(unix)` and `not(windows)` paths (the Secret Service vault, the policy
  # file, Claude Code's ownership check, notifications with a click), with the GTK/WebKitGTK stack, and the
  # AppImage and .deb built as a smoke test.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev
      - name: Rust from desktop/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Install the interface's packages
        run: npm ci
        working-directory: desktop/app
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the AppImage and the .deb
        run: npx tauri build --bundles appimage,deb
        working-directory: desktop/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Remora-linux
          path: |
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/deb/*.deb
