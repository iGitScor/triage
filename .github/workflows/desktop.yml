name: Windows and Linux

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "scripts/make-policy-files.py"
      - "policy/**"
      - "scripts/make-notices.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "macos/scripts/translations_fr.py"
      - "scripts/make-emoji.py"
      - "scripts/make-policy-files.py"
      - "policy/**"
      - "scripts/make-notices.py"
      - "macos/Resources/Logos/**"
      - "site/public/site/tokens.css"
      - ".github/workflows/desktop.yml"

# No debug info in CI builds: faster to compile and link, and a smaller cache. Releases build their own way.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust from desktop/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Install the interface's packages
        run: npm ci
        working-directory: desktop/app
      - name: Every string the app shows has French, and fr.json is up to date
        run: python scripts/make-i18n.py --check
        working-directory: desktop/app
      - name: Emoji tables match scripts/make-emoji.py
        run: python ../scripts/make-emoji.py --check
      - name: Type-check, test and build the interface
        run: npm run check && npm test && npm run build
        working-directory: desktop/app
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # From the debug build the tests just made: the packaging is checked, not a second, optimized compile.
      - name: Build the installer
        if: github.event_name != 'pull_request'
        run: npx tauri build --debug
        working-directory: desktop/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: Remora-windows
          path: desktop/target/debug/bundle/nsis/*.exe

  # Pull requests (mostly Dependabot's) stop after the tests: the installer, the Linux packages and the licence
  # notices are built on pushes, and by every release.
  # The same Rust on Linux (LINUX-04): the `cfg(unix)` and `not(windows)` paths (the Secret Service vault, the policy
  # file, Claude Code's ownership check, notifications with a click), with the GTK/WebKitGTK stack, and the
  # AppImage and .deb built as a smoke test.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev
      - name: Rust from desktop/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Install the interface's packages
        run: npm ci
        working-directory: desktop/app
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - name: The policy files match scripts/make-policy-files.py
        run: python3 ../scripts/make-policy-files.py --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the AppImage and the .deb
        if: github.event_name != 'pull_request'
        run: npx tauri build --debug --bundles appimage,deb
        working-directory: desktop/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: Remora-linux
          path: |
            desktop/target/debug/bundle/appimage/*.AppImage
            desktop/target/debug/bundle/deb/*.deb

  # The licences the packages ship (DEP-07): one file for Windows and Linux, so one job, beside the others. The
  # release builds it again on each system.
  notices:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      ABOUT: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
      ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust from desktop/rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - run: npm ci
        working-directory: desktop/app
      - name: Third-party notices
        run: |
          curl -fsSL -o "$RUNNER_TEMP/about.tgz" "$ABOUT"
          echo "$ABOUT_SHA256  $RUNNER_TEMP/about.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/about.tgz" -C "$RUNNER_TEMP"
          CARGO_ABOUT="$RUNNER_TEMP/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" python3 ../scripts/make-notices.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: THIRD-PARTY-NOTICES
          path: desktop/app/src-tauri/notices/THIRD-PARTY-NOTICES.txt
