name: Format

# Web code (Biome) and Python scripts (ruff). Swift and Rust formatting are checked in the macOS and Windows
# workflows, which already have their toolchains. Locally: `make format-check`, or `make format` to fix.
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Biome
        run: npm ci --ignore-scripts
      - name: Web code (biome.json)
        run: npx biome ci .
      - name: Python (ruff.toml)
        run: pipx run ruff==0.16.8 format --check . && pipx run ruff==0.16.8 check .
