# Weekly updates. Minor and patch updates come grouped, one pull request per ecosystem; majors come alone.
# The macOS app has no package dependencies.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /windows
    schedule: { interval: weekly }
    groups:
      rust:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      tooling:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /windows/app
    schedule: { interval: weekly }
    groups:
      interface:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
    groups:
      docs:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]
