# cargo deny check: known vulnerabilities, licences compatible with GPL-3.0-or-later, and crates only from
# crates.io. Run by CI (.github/workflows/windows.yml) and `make deps-check`.

[graph]
# What ships: the Windows app. Developing on a Mac pulls a few more crates that never reach users.
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included, until it is fixed or explicitly ignored
# here with a reason.
ignore = []

[licenses]
# Each of these can be combined with GPL-3.0-or-later. A new licence fails the check until someone looks at it.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate (windows-sys, winreg, dirs…) are reported, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
