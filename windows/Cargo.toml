[workspace]
resolver = "2"
members = ["crates/remora_core", "crates/remora_plugins", "crates/remora_app", "app/src-tauri"]
# `cargo test` without --workspace skips the tray app, which needs the built interface (npm run build in app/).
default-members = ["crates/remora_core", "crates/remora_plugins", "crates/remora_app"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
