[package]
name = "remora_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remora's application layer for Windows: storage, credentials, policy and the inbox service. No UI."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
remora_core = { version = "0.2.0", path = "../remora_core" }
remora_plugins = { version = "0.2.0", path = "../remora_plugins" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
