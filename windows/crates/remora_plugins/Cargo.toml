[package]
name = "remora_plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
regex = "1.13.1"
remora_core = { version = "0.4.0", path = "../remora_core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
# Claude Code runs as a child process, its prompt written on stdin.
tokio = { version = "1.53.2", features = ["process", "io-util", "time", "rt", "macros"] }

[target.'cfg(unix)'.dependencies]
# Who owns the `claude` Remora runs; only checked where ownership means the same as on macOS.
libc = "0.2.190"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
