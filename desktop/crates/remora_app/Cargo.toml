[package]
name = "remora_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remora's application layer for Windows and Linux: storage, credentials, policy and the inbox service. No UI."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
remora_core = { version = "0.9.0", path = "../remora_core" }
remora_plugins = { version = "0.9.0", path = "../remora_plugins" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "no-serde-warnings"] }

# The vault: the platform's own store, each target with only its backend.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.56"
# The `remora` command's named pipe, open to this user only; the version the tray app already uses.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# The kernel keyring as a cache over the Secret Service (GNOME Keyring, KWallet, KeePassXC), which keeps tokens
# across reboots: the kernel keyring alone forgets them.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
