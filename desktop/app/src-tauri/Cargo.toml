[package]
name = "remora"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remora for Windows and Linux: the tray app."
publish = false

[lib]
name = "remora_tray"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
remora_core = { path = "../../crates/remora_core" }
remora_plugins = { path = "../../crates/remora_plugins" }
remora_app = { path = "../../crates/remora_app" }
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"
# `remora://` links (IDEA-06): registered by the installer and the .deb, and at launch for the AppImage.
tauri-plugin-deep-link = "2.5.0"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
# Updates, opt-in: signed with the release key in tauri.conf.json.
tauri-plugin-updater = "2.13.0"
# Decodes the avatar URL in an avatar: request; already in the tree through url.
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
sys-locale = "0.3.2"
tokio = { version = "1.53.2", features = ["time", "sync", "macros"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Toasts with a click handler (the notification plugin has none on desktop); the version the plugin already uses.
tauri-winrt-notification = "0.8.1"
# Whether Windows lets Remora's notifications show (Settings says when it doesn't); the version the toasts use.
windows = { version = "0.62.2", features = ["UI_Notifications"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Notifications with a click action (the notification plugin has none on desktop); the version the plugin already uses.
notify-rust = "4.18.2"
# Ctrl+Alt+R from anywhere on Wayland, through the desktop's GlobalShortcuts portal (KDE Plasma, GNOME 48+).
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3.32"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
